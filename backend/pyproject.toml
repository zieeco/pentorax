[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentorax"
version = "0.1.0"
description = "Pentorax backend"
requires-python = ">=3.12"

dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15.0",
    "django-filter>=24.3",
    "django-cors-headers>=4.6.0",
    "python-dotenv>=1.0.0",
    "paystack>=1.5.0",
    "Pillow>=11.0.0",
    "psycopg2-binary>=2.9.10",
    "gunicorn>=23.0.0",
    "resend>=2.0.0",
    "boto3>=1.35.0",
    "whitenoise>=6.8.0",
]

[project.optional-dependencies]
prod = [
    "sentry-sdk>=2.20.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4.0",
    "ipython>=8.30.0",
    "black>=24.12.0",
    "flake8>=7.1.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

# ====================== Package Discovery Fix ======================
[tool.setuptools]
# Disable treating loose .py files as modules (prevents flat-layout confusion)
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]   # Explicitly include your two top-level packages
namespaces = false

# ====================== Tool Configurations ======================
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
